spring:
  main:
    web-application-type: none
    banner-mode: off
  application:
    name: tripplanning-seed-job
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tripplanning}
    username: ${SPRING_DATASOURCE_USERNAME:tripplanning}
    password: ${SPRING_DATASOURCE_PASSWORD:tripplanning}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  cloud:
    gcp:
      project-id: ${GOOGLE_CLOUD_PROJECT:tbd-cloudappdev}
      firestore:
        database-id: ${GCP_FIRESTORE_DATABASE_ID:(default)}
        emulator:
          enabled: ${SPRING_CLOUD_GCP_FIRESTORE_EMULATOR_ENABLED:false}
        host-port: ${SPRING_CLOUD_GCP_FIRESTORE_HOST_PORT:}

tripplanning:
  seed:
    enabled: ${TRIPPLANNING_SEED_ENABLED:false}
    wipe-before-seed: ${TRIPPLANNING_SEED_WIPE_BEFORE_SEED:true}
    manifest-output-path: ${TRIPPLANNING_SEED_MANIFEST_PATH:/tmp/perf_seed_manifest.json}
    copy-manifest-to: ${TRIPPLANNING_SEED_MANIFEST_COPY_TO:}

logging:
  level:
    root: INFO
    com.tripplanning.seed: INFO
