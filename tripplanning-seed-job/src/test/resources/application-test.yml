spring:
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  datasource:
    url: jdbc:h2:mem:seedtest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  cloud:
    gcp:
      firestore:
        enabled: false

tripplanning:
  seed:
    enabled: true
    wipe-before-seed: false
    manifest-output-path: target/test-perf_seed_manifest.json
