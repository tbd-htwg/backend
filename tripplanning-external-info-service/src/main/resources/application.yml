server:
  port: 8082

tripplanning:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  auth:
    jwt-secret: ${TRIPPLANNING_AUTH_JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

external-api:
  nominatim:
    url: https://nominatim.openstreetmap.org
  aa:
    url: https://api.auswaertiges-amt.de/v1
  open-meteo:
    url: https://api.open-meteo.com/v1
  viator:
    api-key: ${VIATOR_API_KEY:}
    base-url: "https://api.viator.com/partner/products/search"
