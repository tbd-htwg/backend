server:
  port: 8082

tripplanning:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  platform:
    host-base: ${TRIPPLANNING_PLATFORM_HOST_BASE:k8s.tbd-htwg.de}
  services:
    internal-secret: ${TRIPPLANNING_INTERNAL_SECRET:}
  auth:
    jwt-secret: ${TRIPPLANNING_AUTH_JWT_SECRET:local-dev-only-change-me-32bytes-min!!}
    test-bearer-token: ${TRIPPLANNING_AUTH_TEST_BEARER_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

external-api:
  google:
    maps:
      api-key: ${GOOGLE_MAPS_API_KEY:missing_google_key}
      base-url: https://places.googleapis.com/v1
    routes:
      base-url: https://routes.googleapis.com/directions/v2:computeRoutes
  aa:
    url: https://api.auswaertiges-amt.de/v1
  open-meteo:
    url: https://api.open-meteo.com/v1
  viator:
    api-key: ${VIATOR_API_KEY:missing_viator_key}
    base-url: https://api.sandbox.viator.com
