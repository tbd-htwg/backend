# Kubernetes (minikube / GKE): use in-cluster OpenSearch for Hibernate Search (Elasticsearch-protocol backend).
# Activate with SPRING_PROFILES_ACTIVE=local,k8s (minikube) or omit gke-dev on GKE.
spring:
  config:
    activate:
      on-profile: k8s

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  elasticsearch:
    restclient:
      sniffer:
        enabled: false

  jpa:
    properties:
      hibernate:
        search:
          # Default write-sync fails the HTTP request when Elasticsearch is down or restarting
          # (JpaSystemException in afterTransactionCompletion). Async keeps DB writes successful.
          indexing:
            plan:
              synchronization:
                strategy: async
          backend:
            type: elasticsearch
            version: ${HIBERNATE_SEARCH_BACKEND_VERSION:opensearch:2.19}
            protocol: ${ELASTICSEARCH_PROTOCOL:http}
            hosts: ${ELASTICSEARCH_HOSTS:opensearch.tripplanning.svc.cluster.local:9200}
            username: ${ELASTICSEARCH_USERNAME:}
            password: ${ELASTICSEARCH_PASSWORD:}
            path_prefix: ${ELASTICSEARCH_PATH_PREFIX:}
          schema_management:
            # create-or-validate fails when mappings change (e.g. transport type → start/end addresses).
            strategy: create-or-update

server:
  shutdown: graceful

tripplanning:
  search:
    readiness-enabled: true
  cache:
    redis-ttl-seconds: ${TRIPPLANNING_CACHE_REDIS_TTL_SECONDS:30}
