# Kubernetes (minikube / GKE): use in-cluster Elasticsearch for Hibernate Search.
# Activate with SPRING_PROFILES_ACTIVE=local,k8s (minikube) or omit gke-dev on GKE.
spring:
  config:
    activate:
      on-profile: k8s

  elasticsearch:
    restclient:
      sniffer:
        enabled: false

  jpa:
    properties:
      hibernate:
        search:
          # Default write-sync fails the HTTP request when Elasticsearch is down or restarting
          # (JpaSystemException in afterTransactionCompletion). Async keeps DB writes successful.
          indexing:
            plan:
              synchronization:
                strategy: async
          backend:
            type: elasticsearch
            protocol: ${ELASTICSEARCH_PROTOCOL:http}
            hosts: ${ELASTICSEARCH_HOSTS:elasticsearch.tripplanning.svc.cluster.local:9200}
            username: ${ELASTICSEARCH_USERNAME:}
            password: ${ELASTICSEARCH_PASSWORD:}
            path_prefix: ${ELASTICSEARCH_PATH_PREFIX:}
          schema_management:
            # create-or-validate fails when mappings change (e.g. transport type → start/end addresses).
            strategy: create-or-update

tripplanning:
  search:
    readiness-enabled: true
