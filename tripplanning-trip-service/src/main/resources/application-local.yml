# Local development against H2 (file store under ./temp/db/) and Hibernate Search Lucene (indexes under ./temp/search/).
# Activate: SPRING_PROFILES_ACTIVE=local  or  --spring.profiles.active=local

spring:
  config:
    activate:
      on-profile: local

  # Local H2 is recreated on every run by Hibernate (ddl-auto: create-drop below),
  # so Flyway is redundant and its Postgres-flavored V1 migration would not run
  # cleanly against H2. Keep the migrations source of truth in db/migration for
  # production and let Hibernate regenerate the schema from entities here.
  flyway:
    enabled: false

  datasource:
    # MODE=PostgreSQL improves compatibility with PostgreSQL in other environments
    url: jdbc:h2:file:./temp/db/tripplanning-dev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  elasticsearch:
    restclient:
      sniffer:
        enabled: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      # Recreate H2 schema each run; easy clean slate for local dev.
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        # Mirror the production batching so local SQL counts reflect prod behaviour.
        default_batch_fetch_size: 32
        jdbc:
          lob:
            non_contextual_creation: true
        # Search backend: Lucene when profile local only (application-local-lucene.yml);
        # Elasticsearch when local,k8s or GKE (application-k8s.yml).

  cloud:
    gcp:
      project-id: tripplanning-local
      # ms2 dev defaults; override via GCP_IMPERSONATE_SERVICE_ACCOUNT / GCP_STORAGE_BUCKET_NAME (ConfigMap or env)
      impersonate-service-account: ${GCP_IMPERSONATE_SERVICE_ACCOUNT:tripplanning-image-url-sig@tbd-cloudappdev.iam.gserviceaccount.com}
      storage:
        bucket-name: ${GCP_STORAGE_BUCKET_NAME:tbd-test}
      sql:
        enabled: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

tripplanning:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  services:
    # JVM on host: localhost defaults. Minikube/GKE: set via ConfigMap (TRIPPLANNING_*_SERVICE_URL).
    social-base-url: ${TRIPPLANNING_SOCIAL_SERVICE_URL:http://localhost:8081}
    external-info-base-url: ${TRIPPLANNING_EXTERNAL_INFO_SERVICE_URL:http://localhost:8082}
  auth:
    # Dev-only default; override with TRIPPLANNING_AUTH_JWT_SECRET in shared environments.
    jwt-secret: ${TRIPPLANNING_AUTH_JWT_SECRET:local-dev-only-change-me-32bytes-min!!}
    firebase-project-id: ${TRIPPLANNING_AUTH_FIREBASE_PROJECT_ID:project-9118634e-c9f1-4f29-804}
