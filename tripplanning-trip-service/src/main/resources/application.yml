server:
  port: 8080

# Comma-separated. Override in production via CORS_ALLOWED_ORIGINS if needed.
tripplanning:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://tbd-htwg.de,https://www.tbd-htwg.de,https://iaas.tbd-htwg.de,https://paas.tbd-htwg.de}
  auth:
    firebase-project-id: ${TRIPPLANNING_AUTH_FIREBASE_PROJECT_ID:project-9118634e-c9f1-4f29-804}
    jwt-secret: ${TRIPPLANNING_AUTH_JWT_SECRET:}
    jwt-expiration-seconds: ${TRIPPLANNING_AUTH_JWT_EXPIRATION_SECONDS:43200}
    # Optional shared bearer for seeders / load tests. When set, requests presenting it as
    # `Authorization: Bearer <token>` together with `X-Act-As-User: <userId>` are authenticated as
    # that user (no JWT verification). Leave empty in production; only configure this secret on the
    # `develop` (and optionally `staging`) GitHub Environment.
    test-bearer-token: ${TRIPPLANNING_AUTH_TEST_BEARER_TOKEN:}
  # Hibernate Search logical index name for TripEntity. Use distinct values per environment when
  # several backends share one Elasticsearch cluster (e.g. tripentity-develop, tripentity-staging).
  search:
    elasticsearch-index-name: ${TRIPPLANNING_SEARCH_ELASTICSEARCH_INDEX_NAME:tripentity}
    readiness-enabled: ${TRIPPLANNING_SEARCH_READINESS_ENABLED:true}
    lock-key: tripplanning:search:index:lock
    status-key: tripplanning:search:index:status
  services:
    trip-base-url: ${TRIPPLANNING_TRIP_SERVICE_URL:http://localhost:8080}
    social-base-url: ${TRIPPLANNING_SOCIAL_SERVICE_URL:http://localhost:8081}
    external-info-base-url: ${TRIPPLANNING_EXTERNAL_INFO_SERVICE_URL:http://localhost:8082}
    internal-secret: ${TRIPPLANNING_INTERNAL_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, searchIndex
        liveness:
          include: livenessState

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driverClassName: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

  elasticsearch:
    restclient:
      sniffer:
        enabled: false

  # Flyway owns the SQL schema: migrations in db/migration are applied once,
  # tracked in the flyway_schema_history table, and coordinated via a DB lock
  # so multiple Cloud Run instances cold-starting in parallel are safe. Hibernate
  # is then only allowed to validate that its entity mapping matches the schema.
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # Batch lazy loads (collections, ?-many proxies) into IN (?, ?, ...) clauses so the
        # surviving Spring Data REST projections drop from N+1 to ~ceil(N/32) round trips.
        default_batch_fetch_size: 32
        jdbc:
          lob:
            non_contextual_creation: true
        search:
          mapping:
            configurer: bean:tripSearchMappingConfigurer
          backend:
            # Both Lucene and Elasticsearch backends are on the classpath; pick one explicitly.
            type: elasticsearch
            protocol: ${ELASTICSEARCH_PROTOCOL:http}
            hosts: ${ELASTICSEARCH_HOSTS:localhost:9200}
            username: ${ELASTICSEARCH_USERNAME:}
            password: ${ELASTICSEARCH_PASSWORD:}
            path_prefix: ${ELASTICSEARCH_PATH_PREFIX:}
            discovery:
              enabled: false
          schema_management:
            strategy: create-or-validate

  cloud:
    gcp:
      impersonate-service-account: ${GCP_IMPERSONATE_SERVICE_ACCOUNT:}
      sql:
        enabled: false
      storage:
        bucket-name: ${GCP_STORAGE_BUCKET_NAME:milestone2-tbd-cad-images-bucket}

  jackson:
    serialization:
      write-dates-as-timestamps: false

  data:
    rest:
      base-path: /api/v2

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
