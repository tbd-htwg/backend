apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-service
  labels:
    app: trip-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trip-service
  template:
    metadata:
      labels:
        app: trip-service
    spec:
      containers:
        - name: trip-service
          image: tripplanning-trip-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/google/adc.json
          envFrom:
            - secretRef:
                name: trip-service-secrets
            - configMapRef:
                name: trip-service-config
          volumeMounts:
            - name: trip-data
              mountPath: /app/temp
            - name: gcp-adc
              mountPath: /var/secrets/google
              readOnly: true
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests:
              cpu: 1000m
              memory: 768Mi
            limits:
              cpu: 2000m
              memory: 1536Mi
      volumes:
        - name: trip-data
          emptyDir: {}
        - name: gcp-adc
          secret:
            secretName: gcp-adc
            optional: true
