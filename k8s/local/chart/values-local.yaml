# Minikube overrides — merged by scripts/local-dev.sh (helm template -f values.yaml -f values-local.yaml).
backingServices:
  postgres:
    enabled: true

services:
  trip:
    name: trip-service
    image:
      repository: tripplanning-trip-service
      tag: local
    port: 8080
    replicas: 1
    resources:
      requests:
        cpu: "1000m"
        memory: "768Mi"
      limits:
        cpu: "2000m"
        memory: "1536Mi"
    env:
      SPRING_PROFILES_ACTIVE: "local,k8s,postgres"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "tripplanning"
      POSTGRES_USER: "tripplanning"
      POSTGRES_PASSWORD: "tripplanning"
      ELASTICSEARCH_PROTOCOL: "http"
      ELASTICSEARCH_HOSTS: "opensearch:9200"
      HIBERNATE_SEARCH_BACKEND_VERSION: "opensearch:2.19"
      TRIPPLANNING_SEARCH_ELASTICSEARCH_INDEX_NAME: "tripentity-local"
      TRIPPLANNING_SEARCH_READINESS_ENABLED: "true"
      SPRING_DATA_REDIS_HOST: "valkey"
      SPRING_DATA_REDIS_PORT: "6379"
      TRIPPLANNING_SOCIAL_SERVICE_URL: "http://social-service.tripplanning.svc.cluster.local:8081"
      TRIPPLANNING_EXTERNAL_INFO_SERVICE_URL: "http://external-info-service.tripplanning.svc.cluster.local:8082"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    secretRefs:
      - trip-service-secrets
    livenessPath: /actuator/health/liveness
    readinessPath: /actuator/health/readiness
    bootstrap:
      waitForValkey: true
      waitForOpensearch: true
      readinessInitialDelaySeconds: 25
      readinessPeriodSeconds: 10
      readinessFailureThreshold: 60
      livenessInitialDelaySeconds: 45
      livenessPeriodSeconds: 20

  social:
    name: social-service
    image:
      repository: tripplanning-social-service
      tag: local
    port: 8081
    replicas: 1
    resources:
      requests:
        cpu: "300m"
        memory: "384Mi"
      limits:
        cpu: "750m"
        memory: "768Mi"
    env:
      SPRING_PROFILES_ACTIVE: "local"
      SERVER_PORT: "8081"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      TRIPPLANNING_TRIP_SERVICE_URL: "http://trip-service.tripplanning.svc.cluster.local:8080"
      GCP_FIRESTORE_DATABASE_ID: "(default)"
      SPRING_DATA_REDIS_HOST: "valkey"
      SPRING_DATA_REDIS_PORT: "6379"
    secretRefs:
      - social-service-secrets
    livenessPath: /actuator/health/liveness
    readinessPath: /actuator/health/readiness
    bootstrap:
      waitForValkey: true
      readinessInitialDelaySeconds: 15
      readinessPeriodSeconds: 10

  externalInfo:
    name: external-info-service
    image:
      repository: tripplanning-external-info-service
      tag: local
    port: 8082
    replicas: 1
    resources:
      requests:
        cpu: "300m"
        memory: "384Mi"
      limits:
        cpu: "750m"
        memory: "768Mi"
    env:
      SERVER_PORT: "8082"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      SPRING_DATA_REDIS_HOST: "valkey"
      SPRING_DATA_REDIS_PORT: "6379"
    secretRefs:
      - external-info-service-secrets
    readinessPath: /actuator/health/readiness
    livenessPath: /actuator/health/liveness
    bootstrap:
      waitForValkey: true
      readinessInitialDelaySeconds: 15
      readinessPeriodSeconds: 10

# Ingress path order: first match wins (nginx).
ingressRoutes:
  - path: /api/v2/comments
    service: social-service
    port: 8081
    pathType: Prefix
  - path: /api/v2/trips/search/countLikes
    service: social-service
    port: 8081
    pathType: Prefix
  - path: /api/v2/trips/[^/]+/community
    service: social-service
    port: 8081
    pathType: ImplementationSpecific
  - path: /api/v2/trips/[^/]+/comments
    service: social-service
    port: 8081
    pathType: ImplementationSpecific
  - path: /api/v2/trips/[^/]+/liked-by-current-user
    service: social-service
    port: 8081
    pathType: ImplementationSpecific
  - path: /api/v2/trips/[^/]+/like
    service: social-service
    port: 8081
    pathType: ImplementationSpecific
  - path: /api/v2/users/[^/]+/likedTrips$
    service: social-service
    port: 8081
    pathType: ImplementationSpecific
  - path: /api/v2/users/[^/]+/likedTrips/[^/]+
    service: social-service
    port: 8081
    pathType: ImplementationSpecific
  - path: /api/v2/external
    service: external-info-service
    port: 8082
    pathType: Prefix
  - path: /internal/debug
    service: trip-service
    port: 8080
    pathType: Prefix
  - path: /api/search
    service: trip-service
    port: 8080
    pathType: Prefix
  - path: /api/v2
    service: trip-service
    port: 8080
    pathType: Prefix
  - path: /actuator
    service: trip-service
    port: 8080
    pathType: Prefix
  - path: /swagger-ui
    service: trip-service
    port: 8080
    pathType: Prefix
  - path: /v3
    service: trip-service
    port: 8080
    pathType: Prefix

# Enables separate nginx ingress for /debug/opensearch (Dashboards) and /debug/external.
ingressDebugRoutes: true
