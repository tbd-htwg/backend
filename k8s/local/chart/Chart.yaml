apiVersion: v2
name: tripplanning-local
description: Minikube/local manifests for tripplanning (rendered via helm template in scripts/local-dev.sh)
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - name: opensearch
    version: "2.37.0"
    repository: https://opensearch-project.github.io/helm-charts/
    condition: backingServices.opensearch.enabled
  - name: valkey
    version: "0.9.4"
    repository: https://valkey.io/valkey-helm/
    condition: backingServices.valkey.enabled
  - name: opensearch-dashboards
    version: "2.33.0"
    repository: https://opensearch-project.github.io/helm-charts/
    condition: debug.opensearchDashboards.enabled
