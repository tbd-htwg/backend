# Base defaults for local chart. Override in values-local.yaml.
global:
  namespace: tripplanning

ingress:
  type: nginx

localDev:
  enabled: true
  imagePullPolicy: Never

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75
  scaleUpStabilizationSeconds: 60
  scaleDownStabilizationSeconds: 300

debug:
  enabled: true
  valkeyAdmin:
    enabled: true
    image: valkey/valkey-admin:1.0.2
    port: 8080
    valkeyHost: valkey
    valkeyPort: "6379"
    valkeyTls: "false"
    resources:
      requests:
        cpu: "50m"
        memory: "256Mi"
      limits:
        cpu: "250m"
        memory: "512Mi"
  opensearchDashboards:
    enabled: true

backingServices:
  postgres:
    enabled: false
    serviceName: postgres
    image: postgres:16-alpine
    database: tripplanning
    storageSize: 5Gi
    auth:
      username: tripplanning
      password: tripplanning
      passwordKey: password
      existingSecret: ""
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  valkey:
    enabled: true
    serviceName: valkey
  opensearch:
    enabled: true
    serviceName: opensearch

# Official Valkey Helm chart (valkey-io/valkey-helm).
valkey:
  fullnameOverride: valkey
  auth:
    enabled: false
  dataStorage:
    enabled: false
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "150m"
      memory: "256Mi"

# Official OpenSearch Helm chart (opensearch-project/helm-charts), 2.x single-node for local.
opensearch:
  fullnameOverride: opensearch
  singleNode: true
  replicas: 1
  clusterName: opensearch
  masterService: opensearch
  protocol: http
  securityConfig:
    enabled: false
  extraEnvs:
    - name: DISABLE_SECURITY_PLUGIN
      value: "true"
    - name: DISABLE_INSTALL_DEMO_CONFIG
      value: "true"
  opensearchJavaOpts: "-Xms768m -Xmx768m"
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: "500m"
      memory: "1536Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

# Official OpenSearch Dashboards Helm chart (opensearch-project/helm-charts), 2.19.x for local debug UI.
opensearch-dashboards:
  fullnameOverride: opensearch-dashboards
  opensearchHosts: "http://opensearch:9200"
  extraEnvs:
    - name: DISABLE_SECURITY_DASHBOARDS_PLUGIN
      value: "true"
  config:
    opensearch_dashboards.yml: |
      server.host: "0.0.0.0"
      server.basePath: "/debug/opensearch"
      server.rewriteBasePath: true
      opensearch.ssl.verificationMode: none
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

firestoreEmulator:
  enabled: true
  image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators

seedJob:
  enabled: false
  backoffLimit: 1
  wipeBeforeSeed: "true"
  manifestPath: /tmp/perf_seed_manifest.json
  manifestCopyTo: ""
  firestoreHostPort: "firestore-emulator.tripplanning.svc.cluster.local:8080"
  firestoreHost: "firestore-emulator"
  firestorePort: "8080"
  googleCloudProject: "tbd-cloudappdev"
  image:
    repository: tripplanning-seed-job
    tag: local
  resources:
    requests:
      cpu: "500m"
      memory: "768Mi"
    limits:
      cpu: "2000m"
      memory: "1536Mi"

searchReconcileCronJob:
  enabled: false
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 1
  activeDeadlineSeconds: 2100
  ttlSecondsAfterFinished: 86400
  tripServiceUrl: http://trip-service:8080
  forceReindex: true
  curlMaxTimeSeconds: 1800
  image: curlimages/curl:8.5.0
  imagePullPolicy: IfNotPresent
  secretName: trip-service-secrets
  secretKey: TRIPPLANNING_INTERNAL_SECRET
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

ingressDebugRoutes: true
