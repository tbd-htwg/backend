# Base defaults for local chart. Override in values-local.yaml.
global:
  namespace: tripplanning

ingress:
  type: nginx

localDev:
  enabled: true
  imagePullPolicy: Never

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75
  scaleUpStabilizationSeconds: 60
  scaleDownStabilizationSeconds: 300

debug:
  enabled: true
  redisCommander:
    image: rediscommander/redis-commander:latest
    port: 8081
    httpRoot: /debug/redis
    resources:
      requests:
        cpu: "25m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"

backingServices:
  postgres:
    enabled: false
    serviceName: postgres
    image: postgres:16-alpine
    database: tripplanning
    storageSize: 5Gi
    auth:
      username: tripplanning
      password: tripplanning
      passwordKey: password
      existingSecret: ""
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  redis:
    enabled: true
    serviceName: redis
    image: redis:7-alpine
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "150m"
        memory: "256Mi"
  elasticsearch:
    enabled: true
    serviceName: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.18
    storageSize: 5Gi
    # Bulk mass-indexing ~15k trips needs headroom beyond the JVM heap (off-heap buffers, merges).
    javaOpts: "-Xms768m -Xmx768m"
    resources:
      requests:
        cpu: "500m"
        memory: "1536Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"

firestoreEmulator:
  enabled: true
  image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators

seedJob:
  enabled: false
  backoffLimit: 1
  wipeBeforeSeed: "true"
  manifestPath: /tmp/perf_seed_manifest.json
  manifestCopyTo: ""
  firestoreHostPort: "firestore-emulator.tripplanning.svc.cluster.local:8080"
  firestoreHost: "firestore-emulator"
  firestorePort: "8080"
  googleCloudProject: "tbd-cloudappdev"
  image:
    repository: tripplanning-seed-job
    tag: local
  resources:
    requests:
      cpu: "500m"
      memory: "768Mi"
    limits:
      cpu: "2000m"
      memory: "1536Mi"

ingressDebugRoutes: true
