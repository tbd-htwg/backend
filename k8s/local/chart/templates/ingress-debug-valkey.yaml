{{- if and (eq .Values.ingress.type "nginx") .Values.ingressDebugRoutes .Values.debug.valkeyAdmin.enabled }}
---
# Vite SPA uses relative ./assets/ — the browser URL must be /debug/valkey/ (trailing slash).
# Bare /debug/valkey is redirected via ingress-nginx controller http-snippet (see local-dev.sh).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tripplanning-debug-valkey
  labels:
    {{- include "tripplanning.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: $1
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /debug/valkey(/.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: valkey-admin
                port:
                  number: {{ .Values.debug.valkeyAdmin.port }}
{{- end }}
