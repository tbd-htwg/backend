{{- if and (eq .Values.ingress.type "nginx") .Values.ingressDebugRoutes .Values.debug.opensearchDashboards.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tripplanning-debug-opensearch
  labels:
    {{- include "tripplanning.labels" . | nindent 4 }}
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /debug/opensearch
            pathType: Prefix
            backend:
              service:
                name: opensearch-dashboards
                port:
                  number: 5601
{{- end }}
