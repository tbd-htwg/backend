{{- if .Values.seedJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: tripplanning-seed-job
  labels:
    {{- include "tripplanning.labels" . | nindent 4 }}
    app.kubernetes.io/component: seed-job
spec:
  backoffLimit: {{ .Values.seedJob.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: seed-job
        {{- include "tripplanning.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.backingServices.postgres.image }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ .Values.backingServices.postgres.serviceName }} -p 5432 -U {{ .Values.backingServices.postgres.auth.username }}; do
                echo "waiting for postgres..."
                sleep 2
              done
        - name: wait-for-firestore-emulator
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              hostport="{{ .Values.seedJob.firestoreHostPort }}"
              host="${hostport%%:*}"
              port="${hostport##*:}"
              until nc -z "$host" "$port"; do
                echo "waiting for firestore emulator at ${host}:${port}..."
                sleep 2
              done
      containers:
        - name: seed-job
          image: "{{ .Values.seedJob.image.repository }}:{{ .Values.seedJob.image.tag }}"
          imagePullPolicy: {{ .Values.localDev.imagePullPolicy }}
          env:
            - name: TRIPPLANNING_SEED_ENABLED
              value: "true"
            - name: TRIPPLANNING_SEED_WIPE_BEFORE_SEED
              value: {{ .Values.seedJob.wipeBeforeSeed | quote }}
            - name: TRIPPLANNING_SEED_MANIFEST_PATH
              value: {{ .Values.seedJob.manifestPath | quote }}
            - name: TRIPPLANNING_SEED_MANIFEST_COPY_TO
              value: {{ .Values.seedJob.manifestCopyTo | quote }}
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ .Values.backingServices.postgres.serviceName }}:5432/{{ .Values.backingServices.postgres.database }}"
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.backingServices.postgres.auth.username | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.backingServices.postgres.auth.existingSecret }}{{ .Values.backingServices.postgres.auth.existingSecret }}{{ else }}postgres-secret{{ end }}
                  key: {{ .Values.backingServices.postgres.auth.passwordKey | quote }}
            - name: SPRING_CLOUD_GCP_FIRESTORE_EMULATOR_ENABLED
              value: "true"
            - name: SPRING_CLOUD_GCP_FIRESTORE_HOST_PORT
              value: {{ .Values.seedJob.firestoreHostPort | quote }}
            - name: GOOGLE_CLOUD_PROJECT
              value: {{ .Values.seedJob.googleCloudProject | quote }}
          resources:
            requests:
              cpu: {{ .Values.seedJob.resources.requests.cpu }}
              memory: {{ .Values.seedJob.resources.requests.memory }}
            limits:
              cpu: {{ .Values.seedJob.resources.limits.cpu }}
              memory: {{ .Values.seedJob.resources.limits.memory }}
{{- end }}
