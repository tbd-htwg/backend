{{- if .Values.firestoreEmulator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firestore-emulator
  labels:
    {{- include "tripplanning.labels" . | nindent 4 }}
    app.kubernetes.io/component: firestore-emulator
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: firestore-emulator
      {{- include "tripplanning.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: firestore-emulator
        {{- include "tripplanning.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: firestore-emulator
          image: {{ .Values.firestoreEmulator.image | quote }}
          command:
            - gcloud
            - beta
            - emulators
            - firestore
            - start
            - --host-port=0.0.0.0:8080
          ports:
            - containerPort: 8080
              name: firestore
          readinessProbe:
            tcpSocket:
              port: firestore
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: firestore
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: firestore-emulator
  labels:
    {{- include "tripplanning.labels" . | nindent 4 }}
    app.kubernetes.io/component: firestore-emulator
spec:
  selector:
    app.kubernetes.io/component: firestore-emulator
    {{- include "tripplanning.selectorLabels" . | nindent 4 }}
  ports:
    - port: 8080
      targetPort: firestore
{{- end }}
