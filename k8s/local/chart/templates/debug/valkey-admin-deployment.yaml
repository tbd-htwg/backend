{{- if and .Values.debug.enabled .Values.debug.valkeyAdmin.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-admin
  labels:
    {{- include "tripplanning.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: valkey-admin
      {{- include "tripplanning.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: valkey-admin
        {{- include "tripplanning.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: valkey-admin
          image: {{ .Values.debug.valkeyAdmin.image | quote }}
          ports:
            - containerPort: {{ .Values.debug.valkeyAdmin.port }}
          env:
            - name: PORT
              value: {{ .Values.debug.valkeyAdmin.port | quote }}
            - name: VALKEY_HOST
              value: {{ .Values.debug.valkeyAdmin.valkeyHost | quote }}
            - name: VALKEY_PORT
              value: {{ .Values.debug.valkeyAdmin.valkeyPort | quote }}
            - name: VALKEY_TLS
              value: {{ .Values.debug.valkeyAdmin.valkeyTls | quote }}
          resources:
            requests:
              cpu: {{ .Values.debug.valkeyAdmin.resources.requests.cpu }}
              memory: {{ .Values.debug.valkeyAdmin.resources.requests.memory }}
            limits:
              cpu: {{ .Values.debug.valkeyAdmin.resources.limits.cpu }}
              memory: {{ .Values.debug.valkeyAdmin.resources.limits.memory }}
{{- end }}
