{{- if and .Values.debug.enabled .Values.debug.valkeyAdmin.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: valkey-admin
  labels:
    {{- include "tripplanning.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey-admin
spec:
  selector:
    app.kubernetes.io/component: valkey-admin
    {{- include "tripplanning.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.debug.valkeyAdmin.port }}
      targetPort: {{ .Values.debug.valkeyAdmin.port }}
{{- end }}
