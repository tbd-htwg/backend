name: Docker GKE services

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/docker-publish-gke.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-trip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          build-args: SERVICE=trip
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/tripplanning-trip-service:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/tripplanning-trip-service:latest

  build-social:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          build-args: SERVICE=social
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/tripplanning-social-service:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/tripplanning-social-service:latest
