name: Docker GKE services

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
    paths:
      - "Dockerfile"
      - "pom.xml"
      - "tripplanning-common/**"
      - "tripplanning-trip-service/**"
      - "tripplanning-social-service/**"
      - "tripplanning-external-info-service/**"
      - "tripplanning-customfield-service/**"
      - "tripplanning-platform-service/**"
      - "tripplanning-seed-job/**"
      - ".github/workflows/docker-publish-gke.yml"

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: docker-gke-services-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      trip: ${{ steps.detect.outputs.trip }}
      social: ${{ steps.detect.outputs.social }}
      external_info: ${{ steps.detect.outputs.external_info }}
      platform: ${{ steps.detect.outputs.platform }}
      customfield: ${{ steps.detect.outputs.customfield }}
      seed_job: ${{ steps.detect.outputs.seed_job }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            changed_files="__manual__"
          else
            before="${{ github.event.before }}"
            if [[ -z "${before}" || "${before}" =~ ^0+$ ]]; then
              before="$(git rev-list --max-parents=0 HEAD)"
            fi
            changed_files="$(git diff --name-only "${before}" "${GITHUB_SHA}")"
          fi

          echo "Changed files:"
          printf '%s\n' "${changed_files}"

          all=false
          trip=false
          social=false
          external_info=false
          platform=false
          customfield=false
          seed_job=false

          if printf '%s\n' "${changed_files}" | grep -Eq '^(__manual__|Dockerfile$|pom.xml$|tripplanning-common/|\.github/workflows/docker-publish-gke\.yml$)'; then
            all=true
          fi
          if [[ "${all}" == "true" ]] || printf '%s\n' "${changed_files}" | grep -q '^tripplanning-trip-service/'; then
            trip=true
          fi
          if [[ "${all}" == "true" ]] || printf '%s\n' "${changed_files}" | grep -q '^tripplanning-social-service/'; then
            social=true
          fi
          if [[ "${all}" == "true" ]] || printf '%s\n' "${changed_files}" | grep -q '^tripplanning-external-info-service/'; then
            external_info=true
          fi
          if [[ "${all}" == "true" ]] || printf '%s\n' "${changed_files}" | grep -q '^tripplanning-platform-service/'; then
            platform=true
          fi
          if [[ "${all}" == "true" ]] || printf '%s\n' "${changed_files}" | grep -q '^tripplanning-customfield-service/'; then
            customfield=true
          fi
          if [[ "${all}" == "true" ]] || printf '%s\n' "${changed_files}" | grep -q '^tripplanning-seed-job/'; then
            seed_job=true
          fi

          matrix='[]'
          add_service() {
            local enabled="$1"
            local service="$2"
            local build_arg="$3"
            local image="$4"
            local deployment="$5"
            if [[ "${enabled}" != "true" ]]; then
              return
            fi
            matrix="$(
              jq -c \
                --arg service "${service}" \
                --arg build_arg "${build_arg}" \
                --arg image "${image}" \
                --arg deployment "${deployment}" \
                '. + [{service: $service, build_arg: $build_arg, image: $image, deployment: $deployment}]' \
                <<<"${matrix}"
            )"
          }

          add_service "${trip}" "trip" "trip" "tripplanning-trip-service" "trip-service"
          add_service "${social}" "social" "social" "tripplanning-social-service" "social-service"
          add_service "${external_info}" "external-info" "external-info" "tripplanning-external-info-service" "external-info-service"
          add_service "${platform}" "platform" "platform" "tripplanning-platform-service" "platform-service"
          add_service "${customfield}" "customfield" "customfield" "tripplanning-customfield-service" "customfield-service"
          add_service "${seed_job}" "seed-job" "seed-job" "tripplanning-seed-job" ""

          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "trip=${trip}" >> "${GITHUB_OUTPUT}"
          echo "social=${social}" >> "${GITHUB_OUTPUT}"
          echo "external_info=${external_info}" >> "${GITHUB_OUTPUT}"
          echo "platform=${platform}" >> "${GITHUB_OUTPUT}"
          echo "customfield=${customfield}" >> "${GITHUB_OUTPUT}"
          echo "seed_job=${seed_job}" >> "${GITHUB_OUTPUT}"

  build:
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            SERVICE=${{ matrix.build_arg }}
            CACHEBUST=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:${{ github.ref_name == 'main' && 'prod' || 'develop' }}

  deploy:
    needs:
      - detect
      - build
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    environment: gke-dev
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      DEPLOYER_SA_EMAIL: ${{ vars.GCP_BACKEND_DEPLOYER_SA_EMAIL }}
      GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME || 'tripplanning-gke' }}
      GKE_CLUSTER_LOCATION: ${{ vars.GKE_CLUSTER_LOCATION || 'europe-west1' }}
      BUILD_TRIP: ${{ needs.detect.outputs.trip }}
      BUILD_SOCIAL: ${{ needs.detect.outputs.social }}
      BUILD_EXTERNAL_INFO: ${{ needs.detect.outputs.external_info }}
      BUILD_PLATFORM: ${{ needs.detect.outputs.platform }}
      BUILD_CUSTOMFIELD: ${{ needs.detect.outputs.customfield }}
      DEPLOY_ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deploy configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in PROJECT_ID WIF_PROVIDER DEPLOYER_SA_EMAIL GKE_CLUSTER_NAME GKE_CLUSTER_LOCATION; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            printf 'Missing required GitHub environment variable(s): %s\n' "${missing[*]}" >&2
            printf 'Expected gke-dev vars: GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_BACKEND_DEPLOYER_SA_EMAIL.\n' >&2
            printf 'Optional gke-dev vars: GKE_CLUSTER_NAME, GKE_CLUSTER_LOCATION.\n' >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA_EMAIL }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Setup kubectl
        shell: bash
        run: |
          set -euo pipefail
          gcloud components install gke-gcloud-auth-plugin kubectl --quiet
          gcloud container clusters get-credentials "${GKE_CLUSTER_NAME}" \
            --region "${GKE_CLUSTER_LOCATION}" \
            --project "${PROJECT_ID}"

      - name: Deploy changed images
        shell: bash
        run: |
          set -euo pipefail

          declare -A runtime_images=()
          if [[ "${BUILD_TRIP}" == "true" ]]; then
            runtime_images["trip-service"]="ghcr.io/${GITHUB_REPOSITORY}/tripplanning-trip-service:${GITHUB_SHA}"
          fi
          if [[ "${BUILD_SOCIAL}" == "true" ]]; then
            runtime_images["social-service"]="ghcr.io/${GITHUB_REPOSITORY}/tripplanning-social-service:${GITHUB_SHA}"
          fi
          if [[ "${BUILD_EXTERNAL_INFO}" == "true" ]]; then
            runtime_images["external-info-service"]="ghcr.io/${GITHUB_REPOSITORY}/tripplanning-external-info-service:${GITHUB_SHA}"
          fi
          if [[ "${GITHUB_REF_NAME}" == "main" && "${BUILD_CUSTOMFIELD}" == "true" ]]; then
            runtime_images["customfield-service"]="ghcr.io/${GITHUB_REPOSITORY}/tripplanning-customfield-service:${GITHUB_SHA}"
          fi

          set_images_in_namespace() {
            local namespace="$1"
            if [[ "${#runtime_images[@]}" -eq 0 ]]; then
              return
            fi
            for deployment in "${!runtime_images[@]}"; do
              if kubectl -n "${namespace}" get "deployment/${deployment}" >/dev/null 2>&1; then
                kubectl -n "${namespace}" set image \
                  "deployment/${deployment}" \
                  "${deployment}=${runtime_images[$deployment]}"
                kubectl -n "${namespace}" annotate "deployment/${deployment}" \
                  "tripplanning.htwg.dev/deploy-environment=${DEPLOY_ENVIRONMENT}" \
                  "tripplanning.htwg.dev/deploy-branch=${GITHUB_REF_NAME}" \
                  "tripplanning.htwg.dev/deploy-commit=${GITHUB_SHA}" \
                  "tripplanning.htwg.dev/deploy-run-id=${GITHUB_RUN_ID}" \
                  --overwrite
                kubectl -n "${namespace}" rollout status "deployment/${deployment}" --timeout=10m
              fi
            done
          }

          deployment_image() {
            local namespace="$1"
            local deployment="$2"
            local container="$3"
            kubectl -n "${namespace}" get "deployment/${deployment}" \
              -o "jsonpath={.spec.template.spec.containers[?(@.name=='${container}')].image}" \
              2>/dev/null || true
          }

          deployment_annotation() {
            local namespace="$1"
            local deployment="$2"
            local annotation="$3"
            kubectl -n "${namespace}" get "deployment/${deployment}" \
              -o "jsonpath={.metadata.annotations.${annotation}}" \
              2>/dev/null || true
          }

          refresh_deployment_info() {
            local namespace="$1"
            local tier="free"
            local tenant_id="free"
            local built_at
            built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            case "${namespace}" in
              tripplanning-standard)
                tier="standard"
                tenant_id="standard-shared"
                ;;
              tripplanning-ent-*)
                tier="enterprise"
                tenant_id="${namespace#tripplanning-ent-}"
                ;;
            esac

            local services
            services="$(jq -n '{}')"
            add_service_info() {
              local key="$1"
              local deployment="$2"
              local container="$3"
              local enabled="$4"
              local image
              local commit
              local run_id
              image="$(deployment_image "${namespace}" "${deployment}" "${container}")"
              commit="$(deployment_annotation "${namespace}" "${deployment}" "tripplanning\\.htwg\\.dev/deploy-commit")"
              run_id="$(deployment_annotation "${namespace}" "${deployment}" "tripplanning\\.htwg\\.dev/deploy-run-id")"
              if [[ -z "${commit}" && "${image##*:}" =~ ^[0-9a-f]{40}$ ]]; then
                commit="${image##*:}"
              fi
              services="$(
                jq -c \
                  --arg key "${key}" \
                  --arg image "${image}" \
                  --arg commit "${commit}" \
                  --arg runId "${run_id}" \
                  --arg builtAt "${built_at}" \
                  --argjson enabled "${enabled}" \
                  '. + {($key): {
                    enabled: $enabled,
                    image: $image,
                    tag: (if $image == "" then "" else ($image | split(":") | last) end),
                    commit: $commit,
                    shortCommit: (if $commit == "" then "" else $commit[0:12] end),
                    runId: $runId,
                    builtAt: $builtAt
                  }}' \
                  <<<"${services}"
              )"
            }

            add_service_info apiRouter api-router api-router true
            add_service_info trip trip-service trip-service true
            add_service_info social social-service social-service true
            add_service_info externalInfo external-info-service external-info-service true
            if kubectl -n "${namespace}" get deployment/customfield-service >/dev/null 2>&1; then
              add_service_info customfield customfield-service customfield-service true
            else
              add_service_info customfield customfield-service customfield-service false
            fi
            platform_image="$(deployment_image tripplanning-system platform-service platform-service)"
            platform_commit="$(deployment_annotation tripplanning-system platform-service "tripplanning\\.htwg\\.dev/deploy-commit")"
            platform_run_id="$(deployment_annotation tripplanning-system platform-service "tripplanning\\.htwg\\.dev/deploy-run-id")"
            if [[ -z "${platform_commit}" && "${platform_image##*:}" =~ ^[0-9a-f]{40}$ ]]; then
              platform_commit="${platform_image##*:}"
            fi
            services="$(
              jq -c \
                --arg image "${platform_image}" \
                --arg commit "${platform_commit}" \
                --arg runId "${platform_run_id}" \
                --arg builtAt "${built_at}" \
                '. + {platform: {
                  enabled: true,
                  image: $image,
                  tag: (if $image == "" then "" else ($image | split(":") | last) end),
                  commit: $commit,
                  shortCommit: (if $commit == "" then "" else $commit[0:12] end),
                  runId: $runId,
                  builtAt: $builtAt
                }}' \
                <<<"${services}"
            )"

            jq -n \
              --arg environment "${DEPLOY_ENVIRONMENT}" \
              --arg branch "${GITHUB_REF_NAME}" \
              --arg commit "${GITHUB_SHA}" \
              --arg shortCommit "${GITHUB_SHA::12}" \
              --arg repository "${GITHUB_REPOSITORY}" \
              --arg runId "${GITHUB_RUN_ID}" \
              --arg builtAt "${built_at}" \
              --arg tier "${tier}" \
              --arg tenantId "${tenant_id}" \
              --argjson services "${services}" \
              '{
                environment: $environment,
                branch: $branch,
                commit: $commit,
                shortCommit: $shortCommit,
                repository: $repository,
                runId: $runId,
                builtAt: $builtAt,
                tier: $tier,
                tenantId: $tenantId,
                services: $services
              }' > /tmp/deployment-info.json

            kubectl -n "${namespace}" create configmap api-router-live-deployment-info \
              --from-file=deployment-info.json=/tmp/deployment-info.json \
              --dry-run=client \
              -o yaml > /tmp/deployment-info-configmap.yaml
            kubectl -n "${namespace}" apply -f /tmp/deployment-info-configmap.yaml
          }

          if [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
            runtime_namespaces=(tripplanning-free)
          else
            runtime_namespaces=()
            if kubectl get namespace tripplanning-standard >/dev/null 2>&1; then
              runtime_namespaces+=(tripplanning-standard)
            fi
            mapfile -t enterprise_namespaces < <(
              kubectl get namespaces -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' \
                | grep '^tripplanning-ent-' || true
            )
            runtime_namespaces+=("${enterprise_namespaces[@]}")
          fi

          if [[ "${#runtime_images[@]}" -gt 0 ]]; then
            echo "Deploying changed runtime images to namespaces: ${runtime_namespaces[*]}"
            for namespace in "${runtime_namespaces[@]}"; do
              set_images_in_namespace "${namespace}"
            done
          fi

          if [[ "${BUILD_PLATFORM}" == "true" ]]; then
            platform_image="ghcr.io/${GITHUB_REPOSITORY}/tripplanning-platform-service:${GITHUB_SHA}"
            kubectl -n tripplanning-system set image \
              deployment/platform-service \
              platform-service="${platform_image}"
            kubectl -n tripplanning-system annotate deployment/platform-service \
              "tripplanning.htwg.dev/deploy-environment=${DEPLOY_ENVIRONMENT}" \
              "tripplanning.htwg.dev/deploy-branch=${GITHUB_REF_NAME}" \
              "tripplanning.htwg.dev/deploy-commit=${GITHUB_SHA}" \
              "tripplanning.htwg.dev/deploy-run-id=${GITHUB_RUN_ID}" \
              --overwrite
            kubectl -n tripplanning-system rollout status deployment/platform-service --timeout=10m
          fi

          if [[ "${#runtime_images[@]}" -gt 0 || "${BUILD_PLATFORM}" == "true" ]]; then
            for namespace in "${runtime_namespaces[@]}"; do
              refresh_deployment_info "${namespace}"
            done
          fi
