name: Sync GKE Secret Manager secrets


on:
  workflow_dispatch:
  schedule:
    # Periodic reconciliation so secrets stay in sync without manual runs.
    # change to every two hours
    # - cron: "0 */2 * * *"
  repository_dispatch:
    types:
      - sync-gke-secrets
      - tenant-created
      - tenant-updated

permissions:
  contents: read
  id-token: write

concurrency:
  group: gke-secret-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: gke-dev
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      DEPLOYER_SA_EMAIL: ${{ vars.GCP_SECRETS_DEPLOYER_SA_EMAIL || vars.GCP_BACKEND_DEPLOYER_SA_EMAIL }}

      # Required secret values.
      TRIPPLANNING_DB_PASSWORD: ${{ secrets.TRIPPLANNING_DB_PASSWORD }}
      TRIPPLANNING_AUTH_JWT_SECRET: ${{ secrets.TRIPPLANNING_AUTH_JWT_SECRET }}
      TRIPPLANNING_INTERNAL_SECRET: ${{ secrets.TRIPPLANNING_INTERNAL_SECRET }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      # Optional values.
      VIATOR_API_KEY: ${{ secrets.VIATOR_API_KEY }}
      # Non-prod load tests / seeder: shared bearer + X-Act-As-User (never set on production).
      TRIPPLANNING_AUTH_TEST_BEARER_TOKEN: ${{ secrets.TRIPPLANNING_AUTH_TEST_BEARER_TOKEN }}

      # Used to build tripplanning-ghcr-pull-dockerconfigjson.
      GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA_EMAIL }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Sync Secret Manager values
        shell: bash
        run: |
          set -euo pipefail

          require_env() {
            local name="$1"
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub variable/secret: ${name}" >&2
              exit 1
            fi
          }

          require_env PROJECT_ID
          require_env WIF_PROVIDER
          require_env DEPLOYER_SA_EMAIL

          require_env TRIPPLANNING_DB_PASSWORD
          require_env TRIPPLANNING_AUTH_JWT_SECRET
          require_env TRIPPLANNING_INTERNAL_SECRET
          require_env GOOGLE_MAPS_API_KEY
          require_env GHCR_PULL_USERNAME
          require_env GHCR_PULL_TOKEN

          ensure_secret_exists() {
            local secret_name="$1"
            if ! gcloud secrets describe "${secret_name}" --project "${PROJECT_ID}" >/dev/null 2>&1; then
              gcloud secrets create "${secret_name}" \
                --project "${PROJECT_ID}" \
                --replication-policy="automatic"
              echo "Created secret ${secret_name}"
            fi
          }

          sync_secret() {
            local secret_name="$1"
            local secret_value="$2"
            local allow_empty="${3:-false}"

            if [[ "${allow_empty}" != "true" && -z "${secret_value}" ]]; then
              echo "Refusing to sync empty required secret ${secret_name}" >&2
              exit 1
            fi

            ensure_secret_exists "${secret_name}"

            local current_value=""
            if gcloud secrets versions access latest --secret "${secret_name}" --project "${PROJECT_ID}" >/tmp/current_secret_value 2>/dev/null; then
              current_value="$(cat /tmp/current_secret_value)"
            fi

            if [[ "${current_value}" == "${secret_value}" ]]; then
              echo "No change for ${secret_name}"
              return
            fi

            local tmp_file
            tmp_file="$(mktemp)"
            printf '%s' "${secret_value}" > "${tmp_file}"
            gcloud secrets versions add "${secret_name}" \
              --project "${PROJECT_ID}" \
              --data-file "${tmp_file}" >/dev/null
            rm -f "${tmp_file}"
            echo "Updated ${secret_name}"
          }

          ghcr_auth="$(printf '%s:%s' "${GHCR_PULL_USERNAME}" "${GHCR_PULL_TOKEN}" | base64 | tr -d '\n')"
          ghcr_config_json="$(printf '{"auths":{"ghcr.io":{"username":"%s","password":"%s","auth":"%s"}}}' "${GHCR_PULL_USERNAME}" "${GHCR_PULL_TOKEN}" "${ghcr_auth}")"

          sync_secret "tripplanning-db-password" "${TRIPPLANNING_DB_PASSWORD}"
          sync_secret "tripplanning-jwt-secret" "${TRIPPLANNING_AUTH_JWT_SECRET}"
          sync_secret "tripplanning-internal-secret" "${TRIPPLANNING_INTERNAL_SECRET}"
          sync_secret "tripplanning-google-maps-api-key" "${GOOGLE_MAPS_API_KEY}"
          sync_secret "tripplanning-viator-api-key" "${VIATOR_API_KEY}" true
          sync_secret "tripplanning-auth-test-bearer-token" "${TRIPPLANNING_AUTH_TEST_BEARER_TOKEN:-}" true
          sync_secret "tripplanning-ghcr-pull-dockerconfigjson" "${ghcr_config_json}"

          echo "Secret sync completed. External Secrets Operator will reconcile tenant namespaces automatically."
