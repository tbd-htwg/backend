server:
  port: 8083

tripplanning:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://k8s.tbd-htwg.de}
  auth:
    firebase-project-id: ${TRIPPLANNING_AUTH_FIREBASE_PROJECT_ID:tbd-cloudappdev}
    jwt-secret: ${TRIPPLANNING_AUTH_JWT_SECRET:local-dev-jwt-secret-min-32-chars!!}
    jwt-expiration-seconds: ${TRIPPLANNING_AUTH_JWT_EXPIRATION_SECONDS:43200}
  services:
    trip-base-url: ${TRIPPLANNING_TRIP_SERVICE_URL:http://localhost:8080}
    internal-secret: ${TRIPPLANNING_INTERNAL_SECRET:}
  platform:
    host-base: ${TRIPPLANNING_PLATFORM_HOST_BASE:k8s.tbd-htwg.de}
    enterprise-host-base: ${TRIPPLANNING_PLATFORM_ENTERPRISE_HOST_BASE:enterprise.k8s.tbd-htwg.de}
    bootstrap-admin-email: ${TRIPPLANNING_PLATFORM_BOOTSTRAP_ADMIN_EMAIL:admin@platform.demo}
    gcp:
      project-id: ${TRIPPLANNING_PLATFORM_GCP_PROJECT_ID:}
    provisioning:
      use-stubs: ${TRIPPLANNING_PLATFORM_USE_STUBS:true}
    github:
      dispatch-url: ${TRIPPLANNING_PLATFORM_GITHUB_DISPATCH_URL:}
      dispatch-token: ${TRIPPLANNING_PLATFORM_GITHUB_DISPATCH_TOKEN:}
      standard-event-type: tenant-created-standard
      enterprise-event-type: tenant-created-enterprise
    standard-postgres:
      jdbc-url: ${TRIPPLANNING_STANDARD_POSTGRES_JDBC_URL:}
      username: ${TRIPPLANNING_STANDARD_POSTGRES_USERNAME:}
      password: ${TRIPPLANNING_STANDARD_POSTGRES_PASSWORD:}
    opensearch:
      hosts: ${TRIPPLANNING_PLATFORM_OPENSEARCH_HOSTS:}
      protocol: ${TRIPPLANNING_PLATFORM_OPENSEARCH_PROTOCOL:http}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:platform;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
