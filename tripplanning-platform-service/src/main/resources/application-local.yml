# Local development: enable dev-login and Firebase against the shared dev project.
# localhost / 127.0.0.1 resolve to the seeded develop tenant (enterprise-capable, stub stack).
spring:
  config:
    activate:
      on-profile: local

tripplanning:
  auth:
    firebase-project-id: ${TRIPPLANNING_AUTH_FIREBASE_PROJECT_ID:tbd-cloudappdev}
    jwt-secret: ${TRIPPLANNING_AUTH_JWT_SECRET:local-dev-jwt-secret-min-32-chars!!}
