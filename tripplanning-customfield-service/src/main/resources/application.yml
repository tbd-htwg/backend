server:
  port: ${SERVER_PORT:8084}

tripplanning:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://tbd-htwg.de,https://www.tbd-htwg.de,https://k8s.tbd-htwg.de}
  auth:
    firebase-project-id: ${TRIPPLANNING_AUTH_FIREBASE_PROJECT_ID:tbd-cloudappdev}
    jwt-secret: ${TRIPPLANNING_AUTH_JWT_SECRET:}
    jwt-expiration-seconds: ${TRIPPLANNING_AUTH_JWT_EXPIRATION_SECONDS:43200}
    test-bearer-token: ${TRIPPLANNING_AUTH_TEST_BEARER_TOKEN:}
  platform:
    host-base: ${TRIPPLANNING_PLATFORM_HOST_BASE:k8s.tbd-htwg.de}
    enterprise-host-base: ${TRIPPLANNING_PLATFORM_ENTERPRISE_HOST_BASE:enterprise.k8s.tbd-htwg.de}
  services:
    trip-base-url: ${TRIPPLANNING_TRIP_SERVICE_URL:http://localhost:8080}
    internal-secret: ${TRIPPLANNING_INTERNAL_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

spring:
  cloud:
    gcp:
      firestore:
        database-id: ${GCP_FIRESTORE_DATABASE_ID:tbd-firestore}

springdoc:
  api-docs:
    enabled: false
